# Default three-node lab inventory; connection secrets stay on the controller.
[defaults]
inventory = ./ansible/inventory/lab/hosts.yml
private_key_file = ~/.ssh/k8s-vm-lab.pem
remote_user = ubuntu
host_key_checking = True
retry_files_enabled = False
forks = 3
roles_path = ./ansible/roles
interpreter_python = auto_silent
timeout = 10

[ssh_connection]
pipelining = True
