---
- name: Validate access and baseline variables
  ansible.builtin.import_tasks: validate.yml

- name: Refresh apt metadata before package changes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ baseline_apt_cache_valid_time }}"

- name: Observe installed baseline packages
  ansible.builtin.package_facts:
    manager: auto

- name: Install baseline services without a distribution upgrade
  ansible.builtin.apt:
    name: [apparmor, apparmor-utils, auditd, ca-certificates, chrony, logrotate, nftables, tzdata]
    state: present

- name: Configure host identity and time
  ansible.builtin.import_tasks: identity.yml

- name: Disable swap for the selected Kubernetes profile
  ansible.builtin.import_tasks: swap.yml
  when: baseline_swap_disabled | bool

- name: Configure bounded logs and conservative hardening
  ansible.builtin.import_tasks: hardening.yml

- name: Configure and validate SSH policy
  ansible.builtin.import_tasks: ssh.yml

- name: Prepare the reviewed host-input firewall
  ansible.builtin.import_tasks: firewall.yml
  when: baseline_firewall_enabled | bool

- name: Prepare explicitly declared extra LVM storage
  ansible.builtin.import_tasks: lvm.yml
  when: baseline_lvm_enabled | bool

- name: Enable installed baseline services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [chrony, auditd, apparmor, logrotate.timer]
  when: not ansible_check_mode or (item | regex_replace('\.timer$', '')) in ansible_facts.packages

- name: Describe check-mode limitations
  ansible.builtin.debug:
    msg: >-
      Check mode predicts file/package changes. SSH reload, swapoff, firewall
      activation/rollback, service restarts and LVM changes are not executed.
      Missing-package services and audit configuration require a later apply.
  when: ansible_check_mode
