---
- name: Read-only guest qualification after provisioning
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Verify declared OS, architecture, memory and node interface
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] == baseline_expected_architecture
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == baseline_expected_release
          - ansible_facts['memtotal_mb'] >= (baseline_expected_memory_mib | int * 0.85)
          - ansible_host in ansible_facts['all_ipv4_addresses']
          - baseline_expected_interface in ansible_facts['interfaces']
        fail_msg: Guest observations do not match the declared image, sizing or interface.
