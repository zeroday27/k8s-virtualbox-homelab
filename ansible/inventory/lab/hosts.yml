---
# These names resolve through the controller's SSH configuration.
# Keep addresses, trusted host keys and private keys outside public Git.
all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: -o IdentitiesOnly=yes
    baseline_expected_architecture: aarch64
    baseline_expected_release: '26.04'
    baseline_expected_memory_mib: 2048
    baseline_expected_interface: lab0
  children:
    lab_nodes:
      children:
        control_plane:
          hosts:
            k8s-control-plane-01: {}
        workers:
          hosts:
            k8s-worker-01: {}
            k8s-worker-02: {}
